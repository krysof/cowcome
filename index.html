<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#d9ff43" />
    <title>牛来：草原大逃亡</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <section class="audio-gate" id="audioGate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
      <div class="gate-card">
        <div class="gate-mark">牛</div>
        <div class="eyebrow">进入草原之前</div>
        <h2 id="gateTitle">进入草原</h2>
        <p>雾里有东西在等你。选好角色以后，不要停下，也不要回头。</p>
        <div class="copyright">版权声明<br><a href="http://www.ff18.com" target="_blank" rel="noopener">www.ff18.com</a>　/　白河愁</div>
        <button id="enterGameBtn"><span>进入</span><small>→</small></button>
        <div class="gate-version">VERSION <b>20260820.3</b></div>
      </div>
    </section>

    <div class="noise"></div>
    <header class="hud" id="hud">
      <div class="brand"><b>牛来</b><span>草原大逃亡</span></div>
      <div class="hud-right">
        <div class="distance"><small>距离出口</small><strong id="distance">666m</strong></div>
        <div class="stamina-wrap"><span>体力</span><div class="stamina"><i id="staminaBar"></i></div></div>
      </div>
    </header>

    <aside class="mission" id="mission">
      <span>当前任务</span>
      <strong id="missionText">穿过雾，别回头。</strong>
    </aside>

    <div class="subtitle" id="subtitle"></div>
    <div class="warning" id="warning">它看见你了</div>
    <div class="state-layer danger-state"><span>后面有东西</span></div>
    <div class="state-layer exhausted-state"><span>腿不听使唤了</span></div>
    <div class="crosshair">⌄</div>

    <section class="screen intro" id="intro">
      <div class="intro-copy">
        <div class="eyebrow">一款不太对劲的草原寓言</div>
        <h1><span>牛来</span><em>草原大逃亡</em></h1>
        <p>太阳不会落下。妈妈不会停下。<br />跑到草原尽头，也许那里有出口。</p>
        <div class="chooser" aria-label="选择主角">
          <span>选择主角</span>
          <div>
            <button class="character active" data-character="orange"><i class="orange">牛</i><b>橙色小牛</b></button>
            <button class="character" data-character="yellow"><i class="yellow">牛</i><b>黄色大牛</b></button>
            <button class="character" data-character="leopard"><i class="leopard">豹</i><b>花豹</b></button>
          </div>
        </div>
        <button id="startBtn"><span>开始逃亡</span><small>ENTER</small></button>
        <div class="controls"><b>WASD / 方向键</b> 移动　<b>按住 SHIFT</b> 加速爬行　松开恢复体力</div>
      </div>
      <div class="stamp">粗糙<br />但完整</div>
      <div class="credits">© <a href="http://www.ff18.com" target="_blank" rel="noopener">ff18.com</a> / 白河愁　版本：20260820.3</div>
    </section>

    <section class="screen result" id="result">
      <div>
        <div class="eyebrow" id="resultEyebrow">逃亡终止</div>
        <h2 id="resultTitle">牛来，回家。</h2>
        <p id="resultText"></p>
        <div class="result-actions">
          <button id="restartBtn"><span>再跑一次</span><small>R</small></button>
          <button id="changeBtn" class="secondary"><span>更换角色</span><small>↩</small></button>
        </div>
      </div>
    </section>

    <div class="mobile-controls" aria-label="触屏控制">
      <div class="joystick" id="joystick" aria-label="移动摇杆"><div class="joystick-ring"><i id="joystickKnob"></i></div></div>
      <button class="run" data-key="ShiftLeft" aria-label="按住奔跑"><span>按住</span>奔</button>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
