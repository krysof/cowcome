name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Web is frozen at the last deployment before the character redesign.
      - uses: actions/checkout@v4
        with:
          ref: e471b964eb28db5b13938e4352e602a2b4c06258
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Force installed PWAs to discard the newer character-preview cache.
      - name: Set rollback service-worker cache
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          p=Path("public/sw.js")
          s=p.read_text()
          s=re.sub(r"const CACHE\s*=\s*[^;]+;", "const CACHE='mama-web-frozen-e471b96-20260910';", s, count=1)
          p.write_text(s)
          PYCODE
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
